<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBrain</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Shared icon set -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3" fill="currentColor" opacity=".35"/><path d="M3 10a3 3 0 0 1 3-3h4.2l1.6-2.2A2 2 0 0 1 13.4 4H18a3 3 0 0 1 3 3v3z" fill="currentColor"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="5" rx="1.5"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 1H8a2 2 0 0 1-2-1L5 6"/></symbol>
  </svg>

  <main class="popup">
    <header class="header">
      <div class="brand">
        <svg class="brand-mark"><use href="#i-logo"/></svg>
        <span>TabBrain</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="dashboardBtn" title="Open dashboard" aria-label="Open dashboard"><svg><use href="#i-grid"/></svg></button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <!-- Copy links of the selected tabs -->
    <section class="card copy-card" aria-labelledby="selTitle">
      <div class="card-head">
        <div>
          <div class="eyebrow" id="selEyebrow">Selected tabs</div>
          <div class="card-title" id="selTitle">-</div>
        </div>
        <div class="favicon-stack" id="favStack" aria-hidden="true"></div>
      </div>

      <ul class="sel-list" id="selList"></ul>

      <div class="segmented" id="formatPicker" role="radiogroup" aria-label="Link format"></div>

      <button class="btn btn-primary" id="copyBtn">
        <svg class="btn-icon"><use href="#i-copy"/></svg>
        <span id="copyLabel">Copy links</span>
        <kbd>↵</kbd>
      </button>

      <p class="hint" id="selHint">
        Tip: <kbd>⇧</kbd>-click or <kbd>⌘</kbd>-click tabs in the tab strip to select more than one.
      </p>
      <button class="btn-text" id="copyWindowBtn"></button>
    </section>

    <!-- Save session -->
    <section class="save-row">
      <button class="btn btn-secondary" id="saveBtn">
        <svg class="btn-icon"><use href="#i-archive"/></svg>
        <span id="saveLabel">Save all tabs</span>
      </button>
      <span class="ai-status" id="aiStatus" title=""><span class="dot"></span><span id="aiStatusText"></span></span>
    </section>

    <section class="results" id="results" hidden>
      <div class="section-head">
        <h2>Saved</h2>
        <span class="muted" id="tabCount"></span>
      </div>
      <div class="category-list" id="categoryList"></div>
    </section>

    <section class="sessions">
      <div class="section-head">
        <h2>Recent sessions</h2>
      </div>
      <div class="sessions-list" id="sessionsList"></div>
      <p class="empty" id="emptyState" hidden>No saved sessions yet.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="link-format.js"></script>
  <script src="popup.js"></script>
</body>
</html>

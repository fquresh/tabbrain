<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabBrain - Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>

<body>
    <div class="settings-page">
        <header class="header">
            <div class="header-left">
                <svg class="logo" viewBox="1.8 1.2 21 21" aria-hidden="true"><defs><linearGradient id="logo-grad" x1="3" y1="3" x2="21" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><mask id="logo-folds" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path d="M12.8 3.1c-1 1.9-.8 3.9.6 5.8M4 13.2c2.7.5 5.8 0 9.2-1.5M14.4 15.3c1.6-.9 3.5-1.2 5.5-.9M6.6 6.1c.3 1.4 1.3 2.5 2.7 3.1M18.7 5.3c-.6 1.4-.6 3 .1 4.5" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/></mask></defs><g fill="url(#logo-grad)" mask="url(#logo-folds)"><circle cx="6.9" cy="10.9" r="4.7"/><circle cx="10.4" cy="7.3" r="4.3"/><circle cx="15.3" cy="7.1" r="4.4"/><circle cx="18.5" cy="10.7" r="3.9"/><ellipse cx="11.4" cy="13.7" rx="6.4" ry="3.7"/><circle cx="16.8" cy="15.3" r="3"/><path d="M12.4 15.4h2.8l.9 3.6a1.3 1.3 0 0 1-1.26 1.6h-.5a1.3 1.3 0 0 1-1.3-1.2z"/></g></svg>
                <h1>TabBrain Settings</h1>
            </div>
        </header>

        <section class="section">
            <h2>AI Tagging</h2>
            <p class="section-desc">Enable AI-powered multi-tagging for smarter categorization. Tags are generated by an
                LLM that reads page content.</p>

            <div class="field">
                <label>AI Provider</label>
                <div class="select-wrapper">
                    <select id="provider">
                        <option value="gemini">Google Gemini (your own API key)</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>API Key</label>
                <div class="input-group">
                    <input type="password" id="apiKey" placeholder="Paste your API key here" autocomplete="off">
                    <button class="toggle-vis" id="toggleVis" title="Show/hide key">👁</button>
                </div>
                <p class="field-hint">Get a free key: <a href="https://aistudio.google.com/apikey"
                        target="_blank">aistudio.google.com/apikey</a></p>
            </div>

            <div class="field">
                <button class="test-btn" id="testBtn">Test API Key</button>
                <div class="test-result" id="testResult"></div>
            </div>

            <div class="field toggle-field">
                <label>Enable AI Tagging</label>
                <label class="toggle">
                    <input type="checkbox" id="aiEnabled" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </section>

        <section class="section">
            <h2>Data</h2>
            <div class="field">
                <button class="danger-btn" id="clearBtn">Clear All Saved Sessions</button>
            </div>
        </section>

        <div class="save-bar">
            <button class="save-settings-btn" id="saveSettingsBtn">Save Settings</button>
            <span class="save-status" id="saveStatus"></span>
        </div>
    </div>

    <script src="settings.js"></script>
</body>

</html>

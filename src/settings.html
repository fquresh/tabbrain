<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabBrain — Settings</title>
    <link rel="stylesheet" href="settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="settings-page">
        <header class="header">
            <div class="header-left">
                <span class="logo">🧠</span>
                <h1>TabBrain Settings</h1>
            </div>
        </header>

        <section class="section">
            <h2>AI Tagging</h2>
            <p class="section-desc">Enable AI-powered multi-tagging for smarter categorization. Tags are generated by an
                LLM that reads page content.</p>

            <div class="field">
                <label>AI Provider</label>
                <div class="select-wrapper">
                    <select id="provider">
                        <option value="gemini">Google Gemini (Flash — Free tier)</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>API Key</label>
                <div class="input-group">
                    <input type="password" id="apiKey" placeholder="Paste your API key here" autocomplete="off">
                    <button class="toggle-vis" id="toggleVis" title="Show/hide key">👁</button>
                </div>
                <p class="field-hint">Get a free key: <a href="https://aistudio.google.com/apikey"
                        target="_blank">aistudio.google.com/apikey</a></p>
            </div>

            <div class="field">
                <button class="test-btn" id="testBtn">Test API Key</button>
                <div class="test-result" id="testResult"></div>
            </div>

            <div class="field toggle-field">
                <label>Enable AI Tagging</label>
                <label class="toggle">
                    <input type="checkbox" id="aiEnabled" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </section>

        <section class="section">
            <h2>Data</h2>
            <div class="field">
                <button class="danger-btn" id="clearBtn">Clear All Saved Sessions</button>
            </div>
        </section>

        <div class="save-bar">
            <button class="save-settings-btn" id="saveSettingsBtn">Save Settings</button>
            <span class="save-status" id="saveStatus"></span>
        </div>
    </div>

    <script src="settings.js"></script>
</body>

</html>

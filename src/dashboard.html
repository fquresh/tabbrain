<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabBrain — Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3" fill="currentColor" opacity=".35"/><path d="M3 10a3 3 0 0 1 3-3h4.2l1.6-2.2A2 2 0 0 1 13.4 4H18a3 3 0 0 1 3 3v3z" fill="currentColor"/></svg>
                <h1>TabBrain</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="sessions">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                    </svg>
                    Sessions
                </a>
                <a href="#" class="nav-item" data-view="all-tabs">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    All Tabs
                </a>
                <a href="#" class="nav-item" data-view="insights">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 20V10M12 20V4M6 20v-6" />
                    </svg>
                    Insights
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="sidebar-btn" id="exportBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Export Sessions
                </button>
                <button class="sidebar-btn" id="importBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    Import Sessions
                </button>
                <input type="file" id="importFileInput" accept=".json" hidden>
                <button class="sidebar-btn" id="sidebarSettingsBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main">
            <!-- Top bar -->
            <div class="top-bar">
                <div class="search-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search tabs by title, URL, or tag..."
                        class="search-input">
                </div>
                <button class="save-now-btn" id="saveNowBtn">
                    Save Current Tabs
                </button>
            </div>

            <!-- Sessions View -->
            <div class="view active" id="sessionsView">
                <div class="view-header">
                    <h2>Saved Sessions</h2>
                    <div class="view-filters" id="categoryFilters"></div>
                </div>
                <div class="sessions-grid" id="sessionsGrid">
                    <div class="empty-dash" id="emptyDash">
                        <svg class="empty-dash-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3" fill="currentColor" opacity=".35"/><path d="M3 10a3 3 0 0 1 3-3h4.2l1.6-2.2A2 2 0 0 1 13.4 4H18a3 3 0 0 1 3 3v3z" fill="currentColor"/></svg>
                        <h3>No sessions yet</h3>
                        <p>Click "Save Current Tabs" to capture your first session</p>
                    </div>
                </div>
            </div>

            <!-- All Tabs View -->
            <div class="view" id="allTabsView">
                <div class="view-header">
                    <h2>All Saved Tabs</h2>
                    <div class="all-tabs-filters">
                        <select class="category-dropdown" id="categoryDropdown">
                            <option value="">All Categories</option>
                        </select>
                        <select class="category-dropdown" id="tagDropdown">
                            <option value="">All Tags</option>
                        </select>
                    </div>
                </div>
                <div class="active-filters" id="activeFilters"></div>
                <div class="tabs-table-wrapper">
                    <table class="tabs-table" id="tabsTable">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Tags</th>
                                <th>Saved</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabsTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Insights View -->
            <div class="view" id="insightsView">
                <div class="view-header">
                    <h2>Your Tab Insights</h2>
                </div>
                <div class="insights-grid" id="insightsGrid">
                    <div class="insight-card total-card">
                        <span class="insight-number" id="totalTabsSaved">0</span>
                        <span class="insight-label">Total tabs saved</span>
                    </div>
                    <div class="insight-card sessions-card">
                        <span class="insight-number" id="totalSessions">0</span>
                        <span class="insight-label">Sessions</span>
                    </div>
                    <div class="insight-card categories-card">
                        <span class="insight-number" id="topCategory">—</span>
                        <span class="insight-label">Most common category</span>
                    </div>
                    <div class="insight-card tags-card">
                        <span class="insight-number" id="topTag">—</span>
                        <span class="insight-label">Most common tag</span>
                    </div>
                </div>
                <div class="category-breakdown">
                    <h3>Category Breakdown</h3>
                    <div class="breakdown-bars" id="breakdownBars"></div>
                </div>
                <div class="tag-cloud-section">
                    <h3>Tag Cloud</h3>
                    <div class="tag-cloud" id="tagCloud"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
